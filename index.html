<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瑜伽课堂助手 V1.0</title><link rel="stylesheet" href="css/style.css"></head><body><header><div><strong>✿ 瑜伽课堂助手</strong><small>Yoga Class Assistant · V1.0</small></div><nav><button data-tab="editor" class="active">课程编排</button><button data-tab="library">体式库</button><button data-tab="saved">我的课程</button></nav></header><main><section id="editor" class="tab"><div class="panel"><div class="section-head"><h2>课程信息</h2><button id="newCourse" class="ghost">新建课程</button></div><div class="fields"><label>课程名称<input id="courseTitle" maxlength="80" placeholder="例如：60分钟基础流瑜伽"></label><label>目标时长（分钟）<input id="targetMinutes" type="number" min="1" max="600" value="60"></label><label>难度<select id="courseLevel"><option value="初级">初级</option><option value="中级">中级</option><option value="高级">高级</option></select></label></div><label>课程备注<textarea id="courseNotes" rows="2" placeholder="教学目标、适用人群、注意事项"></textarea></label></div><div class="panel"><div class="section-head"><h2>课程编排</h2><button id="addPose" class="primary">＋ 添加体式</button></div><div id="stats" class="stats"></div><div id="sequence" class="sequence"></div><div class="actions"><button id="saveCourse" class="primary">保存课程</button><button id="duplicateCurrent">复制当前课程</button><button id="startClass">课堂模式</button></div></div></section><section id="library" class="tab hidden"><div class="panel"><h2>体式库</h2><p class="muted">示例体式用于编排测试；仅标注已审核的Liny体式拥有正式素材接入资格。</p><div class="filters"><input id="searchPose" placeholder="搜索中文名 / 梵文名 / 英文名"><select id="filterCategory"><option value="">全部类别</option></select></div><div id="poseGrid" class="pose-grid"></div></div></section><section id="saved" class="tab hidden"><div class="panel"><h2>我的课程</h2><p class="muted">当前版本存储于本浏览器 localStorage；清理浏览器数据可能导致课程丢失。</p><div class="actions"><button id="exportData">导出备份 JSON</button><label class="file-button">导入备份 JSON<input id="importData" type="file" accept=".json,application/json" hidden></label></div><div id="savedList"></div></div></section></main><dialog id="poseDialog"><div class="dialog-head"><h2>选择体式</h2><button id="closePoseDialog" aria-label="关闭">✕</button></div><input id="pickerSearch" placeholder="搜索体式"><div id="pickerList" class="picker-list"></div></dialog><dialog id="classDialog" class="class-dialog"><div class="class-top"><strong id="classCourseTitle"></strong><button id="closeClass">退出课堂</button></div><div class="class-body"><div id="classAsset" class="class-asset"></div><h1 id="classPoseName"></h1><p id="classPoseInfo"></p><div id="classClock" class="clock">00:00</div><p id="classProgress"></p><p id="classNext"></p><div class="actions center"><button id="classPrev">上一个</button><button id="classToggle" class="primary">开始</button><button id="classNextBtn">下一个</button><button id="classReset">重置</button></div></div></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="js/app.js"></script></body></html>
